name: Build NexCut AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Show structure (تشخيص)
        run: |
          echo "📂 محتوى الريبو:"
          ls -la
          echo ""
          echo "🔍 بحث عن ملفات Gradle:"
          find . -name "gradlew" -o -name "settings.gradle*" -o -name "build.gradle*" | grep -v "/\." | head -20
          echo ""
          echo "🔍 بحث عن MainActivity:"
          find . -name "MainActivity.kt" -o -name "MainActivity.java" | grep -v "/\." | head -5
          echo ""
          echo "🔍 بحث عن pubspec.yaml (Flutter):"
          find . -name "pubspec.yaml" | grep -v "/\." | head -5

      - name: Check if Android project
        id: check
        run: |
          if [ -f "./gradlew" ]; then
            echo "✅ مشروع Android Native"
            echo "type=android" >> $GITHUB_OUTPUT
          elif find . -name "pubspec.yaml" | grep -q .; then
            echo "✅ مشروع Flutter"
            echo "type=flutter" >> $GITHUB_OUTPUT
          else
            echo "❌ لم يتم التعرف على نوع المشروع"
            echo "type=unknown" >> $GITHUB_OUTPUT
            exit 1
          fi

      # لو Android Native
      - name: Make gradlew executable
        if: steps.check.outputs.type == 'android'
        run: chmod +x ./gradlew

      - name: Build Android APK (Debug)
        if: steps.check.outputs.type == 'android'
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload Android Debug APK
        if: steps.check.outputs.type == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: nexcut-debug-apk
          path: ./app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # لو Flutter
      - name: Setup Flutter
        if: steps.check.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Get dependencies
        if: steps.check.outputs.type == 'flutter'
        run: flutter pub get

      - name: Flutter Build APK
        if: steps.check.outputs.type == 'flutter'
        run: flutter build apk --release

      - name: Upload Flutter APK
        if: steps.check.outputs.type == 'flutter'
        uses: actions/upload-artifact@v4
        with:
          name: nexcut-flutter-apk
          path: ./build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn