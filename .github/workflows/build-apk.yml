name: Build NexCut AI APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ سحب الكود
      - name: Checkout
        uses: actions/checkout@v5

      # 2️⃣ تجهيز Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ تجهيز Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4️⃣ تجهيز Gradle Cache
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      # 5️⃣ التأكد من صلاحيات gradlew
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 6️⃣ طباعة هيكل المشروع للتشخيص
      - name: Show project structure
        run: |
          echo "📂 Root:"
          ls -la
          echo ""
          echo "📂 Searching for gradlew:"
          find . -name "gradlew" -not -path "*/.*" | head -5
          echo ""
          echo "📂 Searching for settings.gradle:"
          find . -name "settings.gradle*" -not -path "*/.*" | head -5
          echo ""
          echo "📂 Searching for MainActivity:"
          find . -name "MainActivity.kt" -not -path "*/.*" | head -5

      # 7️⃣ بناء APK (Debug)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # 8️⃣ بناء APK (Release)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon
        continue-on-error: true

      # 9️⃣ رفع APK Debug
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: nexcut-ai-debug
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 🔟 رفع APK Release
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: nexcut-ai-release
          path: |
            **/build/outputs/apk/release/*.apk
          if-no-files-found: warn